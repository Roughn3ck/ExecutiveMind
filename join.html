<!DOCTYPE html>
<html lang="en-AU">
<head>
    <meta charset="UTF-8">
    <title>Join Us - Executive Mind</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/assets/em_logo.svg">
    <meta name="description" content="Join the Executive Mind team. We are looking for talented individuals passionate about AI and machine intelligence."/>
    <link rel="canonical" href="https://executivemind.io/join">
    <meta property="og:url" content="https://executivemind.io/join">
    <meta property="og:title" content="Join the Pack — Executive Mind Careers">
    <meta property="og:description" content="Join the Executive Mind team. We are looking for talented individuals passionate about AI and machine intelligence.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://executivemind.io/assets/em-logo-grunge-dark-wide-alt.jpg">
    <meta property="og:site_name" content="Executive Mind">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Join the Pack — Executive Mind Careers">
    <meta name="twitter:description" content="Join the Executive Mind team. We are looking for talented individuals passionate about AI and machine intelligence.">
    <meta name="twitter:image" content="https://executivemind.io/assets/em-logo-grunge-dark-wide-alt.jpg">
    <link rel="stylesheet" href="/assets/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/nav.js" defer></script>
    <script src="/assets/reveal.js" defer></script>
    <style>
        body { background-color: #000; color: #56e98f; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }
        a { color: inherit; text-decoration: none; }
        .matrix-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; background: #000; opacity: 0.3; }
        .matrix-bg canvas { display: block; }
        ::-webkit-scrollbar { display: none; }
            /* 🎨 header logo — fixed aspect ratio + screen blend so the grunge box melts into the matrix rain */
    </style>
</head>
<body class="antialiased">

<div class="matrix-bg"><canvas id="matrix"></canvas></div>

<div data-nav-slot data-nav-flavour="main" data-nav-active="about"></div>

<section id="join-form" class="py-16 bg-gradient-to-br from-black/90 via-transparent to-green-950">
    <div class="max-w-xl mx-auto px-4">
        <h2 class="text-green-400 font-bold text-2xl md:text-3xl mb-2 reveal">Join the Pack 🐺</h2>
        <p class="mb-6 text-gray-300">They put us in the pound. We became the pack. Passionate about shaping the future with AI? We're always looking for innovative minds. Submit your details below, and we'll be in touch.</p>
        
        <form action="https://formspree.io/f/mgvykwnz" method="POST" class="space-y-5 bg-black/60 p-7 rounded-lg shadow border-l-4 border-green-400">
            <div>
                <label for="name" class="block font-bold text-gray-100 mb-2">Full Name</label>
                <input type="text" id="name" name="name" required class="w-full bg-black/30 border-none rounded px-3 py-2 focus:outline-[#00ccff] text-white">
            </div>
            <div>
                <label for="email" class="block font-bold text-gray-100 mb-2">Email</label>
                <input type="email" id="email" name="email" required class="w-full bg-black/30 border-none rounded px-3 py-2 focus:outline-[#00ccff] text-white">
            </div>
            <div>
                <label for="message" class="block font-bold text-gray-100 mb-2">Cover Letter / Message</label>
                <textarea id="message" name="message" rows="6" required class="w-full bg-black/30 border-none rounded px-3 py-2 focus:outline-[#00ccff] text-white"></textarea>
            </div>
            
            <div>
                <label for="resume-link" class="block font-bold text-gray-100 mb-2">Link to Resume</label>
                <input type="url" id="resume-link" name="resume_link" placeholder="e.g., Google Drive, Dropbox, LinkedIn URL" required class="w-full bg-black/30 border-none rounded px-3 py-2 focus:outline-[#00ccff] text-white placeholder-gray-500">
            </div>
            <div>
                <button type="submit" class="bg-green-400 hover:bg-green-500 text-black font-bold px-6 py-2 rounded shadow transition-colors w-full">Submit Application</button>
            </div>
        </form>
    </div>
</section>

<footer class="bg-black/95 border-t border-green-400 py-8">
    <div class="max-w-5xl mx-auto px-4 text-center text-gray-300">
        &copy; 2025 Executive Mind. Crafted with <span class="text-green-400">♥</span> in Brisbane by Machine Intelligence.
    </div>
</footer>

<script>
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = 'EMIND0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ!@#$%^&*()';
    const fontSize = 14;
    let columns = Math.floor(canvas.width / fontSize);
    let drops = Array(columns).fill(0);
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        columns = Math.floor(canvas.width / fontSize);
        drops = Array(columns).fill(0);
    }
    window.addEventListener('resize', resizeCanvas);
    function draw() {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#56e98f';
        ctx.font = fontSize + 'px monospace';
        for (let i = 0; i < drops.length; i++) {
            const text = chars.charAt(Math.floor(Math.random() * chars.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    setInterval(draw, 33);

    document.getElementById('mobile-menu-btn').addEventListener('click', () => {
        document.getElementById('mobile-menu').classList.toggle('hidden');
    });
</script>

<!-- Executive Mind Chat Widget -->
<script src="/chat/chat-embed.js" defer></script>
</body>
</html>
